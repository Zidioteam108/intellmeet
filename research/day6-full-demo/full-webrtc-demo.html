<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IntellMeet WebRTC Full Demo</title>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #0f172a; color: white; line-height: 1.6; }
    .container { max-width: 1000px; margin: 0 auto; }
    .videos { display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
    .video-container { flex: 1; min-width: 300px; background: #1e293b; padding: 15px; border-radius: 16px; border: 1px solid #334155; }
    video { width: 100%; height: auto; background: #020617; border-radius: 8px; transform: scaleX(-1); }
    #remoteVideo { transform: scaleX(1); } /* Don't flip remote video */
    .controls { background: #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid #334155; }
    input { padding: 10px; margin: 5px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; width: 200px; }
    button { padding: 10px 20px; margin: 5px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    #status-log { margin-top: 20px; padding: 15px; background: #020617; border-radius: 8px; font-family: monospace; font-size: 12px; height: 150px; overflow-y: auto; border: 1px solid #334155; }
    .log-entry { margin-bottom: 4px; border-left: 3px solid #3b82f6; padding-left: 8px; }
    .log-error { border-left-color: #ef4444; color: #fca5a5; }
    .log-success { border-left-color: #10b981; color: #a7f3d0; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🚀 IntellMeet WebRTC Signaling Test</h2>
    
    <div class="controls">
      <input id="roomInput" placeholder="Room ID" value="test-room-001" />
      <input id="nameInput" placeholder="Your Name" value="User A" />
      <button class="btn-primary" onclick="startAndJoin()">Start Camera & Join</button>
    </div>

    <div class="videos">
      <div class="video-container">
        <p style="margin-top:0; font-weight:bold; color:#94a3b8;">Local Stream (You)</p>
        <video id="localVideo" autoplay playsinline muted></video>
      </div>
      <div class="video-container">
        <p style="margin-top:0; font-weight:bold; color:#94a3b8;">Remote Stream (Friend)</p>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </div>

    <div id="status-log">
      <div class="log-entry">System ready. Waiting for user to join...</div>
    </div>
  </div>

  <script>
    const logContainer = document.getElementById('status-log');
    function log(msg, type = '') {
      const div = document.createElement('div');
      div.className = `log-entry ${type ? 'log-' + type : ''}`;
      div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logContainer.appendChild(div);
      logContainer.scrollTop = logContainer.scrollHeight;
      console.log(msg);
    }

    const socket = io('http://localhost:5000');
    let localStream, pc;
    let remotePeerId = null;
    let iceQueue = [];

    const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    socket.on('connect', () => log('Connected to Signaling Server: ' + socket.id, 'success'));
    socket.on('connect_error', (err) => log('Connection Error: ' + err.message, 'error'));

    // Handle new users joining
    socket.on('user-joined', async ({ socketId, userName }) => {
      log(`${userName} joined! Initializing WebRTC Offer...`);
      remotePeerId = socketId;
      await createOffer();
    });

    // Handle incoming offers
    socket.on('offer', async ({ from, offer }) => {
      log('Received Offer from ' + from);
      remotePeerId = from;
      await createAnswer(offer);
    });

    // Handle incoming answers
    socket.on('answer', async ({ answer }) => {
      log('Received Answer. Connecting...');
      await pc.setRemoteDescription(new RTCSessionDescription(answer));
      processIceQueue();
    });

    // Handle ICE Candidates
    socket.on('ice-candidate', async ({ from, candidate }) => {
      if (!pc || !pc.remoteDescription) {
        log('Queueing ICE candidate (Remote description not set yet)');
        iceQueue.push(candidate);
        return;
      }
      try {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
        log('Added ICE candidate from ' + from);
      } catch (e) {
        log('Error adding ICE candidate: ' + e.message, 'error');
      }
    });

    function processIceQueue() {
      log(`Processing ${iceQueue.length} queued ICE candidates...`);
      iceQueue.forEach(async (candidate) => {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (e) { console.error(e); }
      });
      iceQueue = [];
    }

    async function startAndJoin() {
      const roomId = document.getElementById('roomInput').value;
      const userName = document.getElementById('nameInput').value;

      try {
        log('Requesting camera/mic access...');
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
        log('Camera started.', 'success');

        setupPeerConnection();
        socket.emit('join-room', { roomId, userId: socket.id, userName });
        log('Joined room: ' + roomId);
      } catch (err) {
        log('Media Error: ' + err.message, 'error');
      }
    }

    function setupPeerConnection() {
      pc = new RTCPeerConnection(servers);
      
      // Add local tracks to peer connection
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      // Handle remote tracks
      pc.ontrack = (e) => {
        log('Remote track received! Drawing video...', 'success');
        document.getElementById('remoteVideo').srcObject = e.streams[0];
      };

      // Handle local ICE candidates
      pc.onicecandidate = (e) => {
        if (e.candidate && remotePeerId) {
          socket.emit('ice-candidate', { to: remotePeerId, candidate: e.candidate });
        }
      };

      pc.onconnectionstatechange = () => {
        log('Connection State: ' + pc.connectionState);
        if (pc.connectionState === 'connected') log('P2P Connection Established!', 'success');
      };
    }

    async function createOffer() {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('offer', { to: remotePeerId, offer });
      log('Offer sent to ' + remotePeerId);
    }

    async function createAnswer(offer) {
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit('answer', { to: remotePeerId, answer });
      log('Answer sent to ' + remotePeerId);
      processIceQueue();
    }
  </script>
</body>
</html>
